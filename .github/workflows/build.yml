name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        variant: [client, admin]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --config electron-builder.${{ matrix.variant }}.json --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: kanki-${{ matrix.variant }}-${{ matrix.os }}
          path: |
            dist/${{ matrix.variant }}/*.dmg
            dist/${{ matrix.variant }}/*.exe
